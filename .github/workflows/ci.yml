name: ci

on:
  push:
    branches: ["**"]
  pull_request:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Restore .NET
        run: dotnet restore FileRecovery.sln

      - name: Build .NET
        run: dotnet build FileRecovery.sln -c Release --no-restore

      - name: Test .NET
        run: dotnet test FileRecovery.sln -c Release --no-build

      - name: License policy gate
        run: .\scripts\license-gate.ps1 -Check

      - name: Rust fmt
        working-directory: engine
        run: cargo fmt --all --check

      - name: Rust test
        working-directory: engine
        run: cargo test --workspace

