[workspace]
resolver = "2"
members = [
  "crates/fr-types",
  "crates/fr-winio",
  "crates/fr-device-enum",
  "crates/fr-volume-meta",
  "crates/fr-ntfs",
  "crates/fr-fat",
  "crates/fr-mft",
  "crates/fr-path-recon",
  "crates/fr-usn",
  "crates/fr-logfile",
  "crates/fr-vss",
  "crates/fr-carving",
  "crates/fr-validator",
  "crates/fr-scoring",
  "crates/fr-session",
  "crates/fr-ffi"
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
chrono = { version = "0.4", features = ["serde", "clock"] }
